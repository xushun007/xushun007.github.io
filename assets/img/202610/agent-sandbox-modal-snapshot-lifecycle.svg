<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="680" viewBox="0 0 1160 680"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker><marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7048e8"/></marker></defs><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#212529}.box{stroke:#343a40;stroke-width:2;rx:16}.title{font-size:24px;font-weight:600}.sub{font-size:18px}.arrow{stroke:#495057;stroke-width:3;fill:none;marker-end:url(#a)}.snap{stroke:#7048e8;stroke-width:3;stroke-dasharray:9 7;fill:none;marker-end:url(#p)}.label{font-size:16px;fill:#495057}.note{font-size:19px}</style><rect x="20" y="20" width="1120" height="640" rx="20" fill="#fff" stroke="#dee2e6"/><text x="60" y="75" class="title">Modal Sandbox：调度、执行与状态快照</text><rect class="box" x="70" y="220" width="230" height="110" fill="#d0ebff"/><text x="185" y="264" text-anchor="middle" class="title">本地调度器</text><text x="185" y="296" text-anchor="middle" class="sub">创建 · 观测 · snapshot · restore</text><rect class="box" x="410" y="220" width="240" height="110" fill="#e7f5ff"/><text x="530" y="264" text-anchor="middle" class="title">Modal API / SDK</text><text x="530" y="296" text-anchor="middle" class="sub">App · Image · Sandbox</text><rect class="box" x="760" y="145" width="320" height="330" fill="#fff3bf"/><text x="920" y="185" text-anchor="middle" class="title">Sandbox guest</text><rect class="box" x="810" y="220" width="220" height="90" fill="#d3f9d8"/><text x="920" y="257" text-anchor="middle" class="title">Navi Agent</text><text x="920" y="284" text-anchor="middle" class="sub">进程 / session</text><rect class="box" x="810" y="350" width="220" height="90" fill="#e6fcf5"/><text x="920" y="387" text-anchor="middle" class="title">NAVI_HOME</text><text x="920" y="414" text-anchor="middle" class="sub">state.db · 日志 · workspace</text><path class="arrow" d="M300 265 L410 265"/><text x="355" y="248" text-anchor="middle" class="label">生命周期 API</text><path class="arrow" d="M650 265 L760 265"/><text x="705" y="248" text-anchor="middle" class="label">创建 / exec</text><path class="arrow" d="M810 396 L650 330"/><text x="720" y="386" text-anchor="middle" class="label">snapshot ID</text><path class="snap" d="M650 310 L760 430"/><text x="704" y="360" text-anchor="middle" class="label">restore 新实例</text><path class="arrow" d="M920 310 L920 350"/><text x="940" y="338" class="label">读写状态</text><text x="70" y="535" class="note">Filesystem snapshot：保存磁盘文件，新 Sandbox + 新 Agent 进程</text><text x="70" y="570" class="note">Memory snapshot：保存 guest 运行状态的尝试；网络连接需重建，能力受 runtime/API 限制</text><text x="70" y="625" class="sub" fill="#6c757d">快照恢复环境或状态，不自动定义业务检查点；进度与外部副作用仍需由应用协议管理。</text></svg>